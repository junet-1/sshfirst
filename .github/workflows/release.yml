name: Release

# Push a tag to cut a release:
#
#   git tag v0.2.3 && git push origin v0.2.3
#
# workflow_dispatch builds the same artifacts without publishing them, which is
# how you validate packaging changes before tagging.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.2.3)'
        required: true
        type: string

permissions:
  contents: read

env:
  # org.gnome.Platform 48 provides GTK 4.18 and WebKitGTK 6.0.
  GNOME_RUNTIME: '48'

jobs:
  version:
    name: Resolve version
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - id: resolve
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            publish=false
          else
            version="${GITHUB_REF_NAME#v}"
            publish=true
          fi
          # Packages reject anything that is not digits and dots (plus an
          # optional prerelease suffix), so fail here rather than three jobs in.
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*([.-][A-Za-z0-9]+)?$ ]]; then
            echo "::error::'$version' is not a usable package version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Building $version (publish: $publish)"

  # Ubuntu 24.04 is the oldest distribution shipping WebKitGTK 6.0, so it is
  # both the natural .deb target and the lowest glibc we can link against. The
  # binary it produces is reused by the Flatpak job.
  build:
    name: Binary, tarball and .deb
    needs: version
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # package-lock.json is generated by npm 12, which omits optional peer
      # dependencies that npm 10 (bundled with Node 22) insists on finding.
      # Without this pin, npm ci fails with "Missing: esbuild@0.28.1 from lock
      # file".
      - run: npm install -g npm@12

      # needrestart prompts during the long dependency tail of
      # libwebkitgtk-6.0-dev and hangs the step; see the same note in ci.yml.
      - name: Install GTK4 and WebKitGTK development files
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y --no-install-recommends \
            -o DPkg::Lock::Timeout=300 \
            libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: Build frontend
        working-directory: frontend
        env:
          APP_VERSION: ${{ env.VERSION }}
        run: |
          npm ci
          npm run build

      - name: Build binary
        env:
          CGO_ENABLED: '1'
        run: |
          go build -trimpath -buildvcs=false -tags production \
            -ldflags '-w -s' -o build/bin/ssh-first .
          ./build/bin/ssh-first --help >/dev/null 2>&1 || true
          file build/bin/ssh-first

      - name: Stage install tree
        run: |
          packaging/stage-tree.sh "$VERSION" build/bin/ssh-first \
            "dist/ssh-first-$VERSION-linux-x86_64"

      - name: Build tarball
        run: |
          tar -C dist -czf "dist/ssh-first-$VERSION-linux-x86_64.tar.gz" \
            "ssh-first-$VERSION-linux-x86_64"

      - name: Build .deb
        run: |
          set -euo pipefail
          stage="dist/ssh-first-$VERSION-linux-x86_64"
          root="dist/debroot"

          install -Dm755 "$stage/bin/ssh-first" "$root/usr/bin/ssh-first"
          install -Dm644 "$stage/share/applications/org.wails.ssh_first.desktop" \
            "$root/usr/share/applications/org.wails.ssh_first.desktop"
          install -Dm644 "$stage/share/metainfo/org.wails.ssh_first.metainfo.xml" \
            "$root/usr/share/metainfo/org.wails.ssh_first.metainfo.xml"
          install -Dm644 "$stage/share/icons/hicolor/1024x1024/apps/ssh-first.png" \
            "$root/usr/share/icons/hicolor/1024x1024/apps/ssh-first.png"
          install -Dm644 "$stage/share/pixmaps/ssh-first.png" \
            "$root/usr/share/pixmaps/ssh-first.png"
          install -Dm644 "$stage/share/autostart/ssh-first.desktop" \
            "$root/etc/xdg/autostart/ssh-first.desktop"
          install -Dm644 LICENSE "$root/usr/share/doc/ssh-first/copyright"

          # Let dpkg work out the real shared-library dependencies from the
          # binary. The hardcoded list is only a fallback for when shlibdeps
          # cannot run, so a packaging change never silently ships no Depends.
          depends='libc6 (>= 2.38), libgtk-4-1 (>= 4.10.0), libwebkitgtk-6.0-4'
          mkdir -p dist/shlibdeps/debian
          printf 'Source: ssh-first\nPackage: ssh-first\nArchitecture: amd64\n' \
            > dist/shlibdeps/debian/control
          if ( cd dist/shlibdeps && dpkg-shlibdeps -O --ignore-missing-info \
                 "../../$root/usr/bin/ssh-first" > deps.txt 2>/dev/null ); then
            resolved=$(sed -n 's/^shlibs:Depends=//p' dist/shlibdeps/deps.txt)
            if [[ -n "$resolved" ]]; then
              depends=$resolved
              echo "dpkg-shlibdeps resolved: $depends"
            fi
          else
            echo "::warning::dpkg-shlibdeps failed, using the fallback Depends list"
          fi

          size=$(du -ks "$root" | cut -f1)
          mkdir -p "$root/DEBIAN"
          cat > "$root/DEBIAN/control" <<EOF
          Package: ssh-first
          Version: $VERSION
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: Julian <juwolf11@googlemail.com>
          Installed-Size: $size
          Depends: $depends
          Recommends: rsync, gnome-keyring | kwalletmanager
          Homepage: https://github.com/junet-1/sshfirst
          Description: SSH, SFTP and admin-panel workspace
           SSH First keeps every server you administrate in one native window:
           interactive SSH terminals, an SFTP file browser, port forwarding, and
           the web control panels of your machines as tabs next to each other.
           .
           It imports hosts from ~/.ssh/config, stores passwords in the desktop
           keyring rather than on disk, and saves whole layouts as shareable
           JSON workspaces.
          EOF

          dpkg-deb --root-owner-group --build "$root" \
            "dist/ssh-first_${VERSION}_amd64.deb"
          dpkg-deb --info "dist/ssh-first_${VERSION}_amd64.deb"
          dpkg-deb --contents "dist/ssh-first_${VERSION}_amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: packages-deb
          path: |
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

      # The Flatpak job packages this exact binary rather than rebuilding
      # it, so both artifacts come from the same build.
      - uses: actions/upload-artifact@v4
        with:
          name: binary-linux-amd64
          path: build/bin/ssh-first
          if-no-files-found: error

  rpm:
    name: .rpm
    needs: version
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    container:
      image: fedora:42
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gtk4-devel webkitgtk6.0-devel gcc pkgconf-pkg-config \
            rpm-build rpmdevtools desktop-file-utils tar gzip findutils \
            python3 git-core

      - uses: actions/checkout@v4

      # Fedora's golang trails go.mod's required version, so the toolchain
      # comes from the action rather than from dnf.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # See the note in the build job: the lock file needs npm 12 to install.
      - run: npm install -g npm@12

      - name: Build frontend
        working-directory: frontend
        env:
          APP_VERSION: ${{ env.VERSION }}
        run: |
          npm ci
          npm run build

      - name: Build binary
        env:
          CGO_ENABLED: '1'
        run: |
          go build -trimpath -buildvcs=false -tags production \
            -ldflags '-w -s' -o build/bin/ssh-first .

      - name: Build .rpm
        run: |
          set -euo pipefail
          rpmdev-setuptree
          packaging/stage-tree.sh "$VERSION" build/bin/ssh-first \
            "dist/ssh-first-$VERSION-linux-x86_64"
          tar -C dist -czf \
            ~/rpmbuild/SOURCES/"ssh-first-$VERSION-linux-x86_64.tar.gz" \
            "ssh-first-$VERSION-linux-x86_64"
          rpmbuild -bb --define "version $VERSION" packaging/ssh-first.spec
          mkdir -p dist/out
          find ~/rpmbuild/RPMS -name '*.rpm' -exec cp {} dist/out/ \;
          rpm -qip dist/out/*.rpm
          rpm -qlp dist/out/*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: packages-rpm
          path: dist/out/*.rpm
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle
    needs: [version, build]
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binary-linux-amd64
          path: build/bin

      - name: Install flatpak-builder
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y --no-install-recommends \
            -o DPkg::Lock::Timeout=300 flatpak flatpak-builder imagemagick
          # Ubuntu 24.04 confines unprivileged user namespaces with AppArmor,
          # which stops the bubblewrap call flatpak-builder makes.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install the GNOME runtime
        run: |
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            "org.gnome.Platform//${GNOME_RUNTIME}" "org.gnome.Sdk//${GNOME_RUNTIME}"

      - name: Stage manifest sources
        run: |
          set -euo pipefail
          chmod +x build/bin/ssh-first
          packaging/stage-tree.sh "$VERSION" build/bin/ssh-first dist/stage
          cp dist/stage/bin/ssh-first packaging/flatpak/ssh-first
          cp dist/stage/share/applications/org.wails.ssh_first.desktop packaging/flatpak/
          cp dist/stage/share/metainfo/org.wails.ssh_first.metainfo.xml packaging/flatpak/
          # appstreamcli compose ignores a lone 1024x1024 icon, and
          # build-export rejects anything above 512x512 outright, so scale the
          # sizes that are actually usable. ImageMagick 7 renamed convert to
          # magick; Ubuntu 24.04 still ships 6, so accept either.
          im=$(command -v magick || command -v convert)
          for size in 64 128 256 512; do
            "$im" build/appicon.png -resize "${size}x${size}" \
              "packaging/flatpak/appicon-${size}.png"
          done
          file packaging/flatpak/appicon-*.png

      - name: Build bundle
        run: |
          set -euo pipefail
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=dist/repo dist/flatpak-build \
            packaging/flatpak/org.wails.ssh_first.yml
          flatpak build-bundle dist/repo \
            "dist/SSH_First-$VERSION-x86_64.flatpak" org.wails.ssh_first \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: actions/upload-artifact@v4
        with:
          name: packages-flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  # macOS builds cannot be cross-compiled (cgo + Objective-C), so this runs on
  # Apple's own runner and produces one universal .app for Apple Silicon and
  # Intel. Without signing secrets the bundle is only ad-hoc signed: it runs,
  # but Gatekeeper makes the user confirm the first launch by hand.
  macos:
    name: macOS app bundle
    needs: version
    timeout-minutes: 40
    runs-on: macos-14
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Job level, not step level: a step's own env: block is not yet in scope
      # when that step's if: is evaluated, so guarding on it there leaves the
      # signing and notarisation steps permanently skipped — and releases
      # silently ad-hoc signed even once the secrets exist. The secrets context
      # is not available in a step if: at all.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # See the build job: the lock file needs npm 12 to install.
      - run: npm install -g npm@12

      - name: Build frontend
        working-directory: frontend
        env:
          APP_VERSION: ${{ env.VERSION }}
        run: |
          npm ci
          npm run build

      - name: Build universal binary
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          for arch in arm64 amd64; do
            GOARCH="$arch" go build -trimpath -buildvcs=false -tags production \
              -ldflags '-w -s' -o "build/bin/ssh-first-$arch" .
          done
          lipo -create -output build/bin/ssh-first \
            build/bin/ssh-first-arm64 build/bin/ssh-first-amd64
          lipo -info build/bin/ssh-first

      # Optional: only runs when the repository has a Developer ID certificate
      # configured. Everything below degrades to an ad-hoc signature otherwise.
      - name: Import signing certificate
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        run: |
          set -euo pipefail
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "" build.keychain
          rm -f certificate.p12

      - name: Assemble app bundle
        run: |
          set -euo pipefail
          # bundle.sh signs ad-hoc when the identity is "-".
          export SIGN_IDENTITY="${MACOS_SIGN_IDENTITY:--}"
          packaging/darwin/bundle.sh "$VERSION" build/bin/ssh-first dist

      - name: Notarise
        if: ${{ env.APPLE_ID != '' }}
        run: |
          set -euo pipefail
          # notarytool takes archives, not raw bundles.
          ditto -c -k --keepParent "dist/SSH First.app" dist/notarize.zip
          xcrun notarytool submit dist/notarize.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          # Stapling lets Gatekeeper verify without a network round trip.
          xcrun stapler staple "dist/SSH First.app"
          rm -f dist/notarize.zip

      - name: Build disk image
        run: |
          set -euo pipefail
          hdiutil create -volname 'SSH First' -srcfolder 'dist/SSH First.app' \
            -ov -format ULFO "dist/SSH-First-$VERSION-macos-universal.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: packages-macos
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, build, rpm, flatpak, macos]
    if: needs.version.outputs.publish == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          ## Install

          **Debian / Ubuntu 24.04+**
          \`\`\`sh
          sudo apt install ./ssh-first_${VERSION}_amd64.deb
          \`\`\`

          **Fedora**
          \`\`\`sh
          sudo dnf install ./ssh-first-${VERSION}-1.*.x86_64.rpm
          \`\`\`

          **Flatpak (any distribution)**
          \`\`\`sh
          flatpak install --user ./SSH_First-${VERSION}-x86_64.flatpak
          \`\`\`

          **Arch Linux**: build from the checkout with \`cd packaging && makepkg -si\`.

          **macOS 12+ (Apple Silicon and Intel)**: open
          \`SSH-First-${VERSION}-macos-universal.dmg\` and drag SSH First to
          Applications. The build is not signed with an Apple Developer ID, so
          the first launch needs a right click → Open to get past Gatekeeper.

          The \`.deb\`, \`.rpm\` and tarball use your distribution's GTK 4 and
          WebKitGTK 6.0. The Flatpak brings its own, so it runs anywhere.

          Verify downloads against \`SHA256SUMS\`.
          EOF

          gh release create "v$VERSION" \
            --title "SSH First $VERSION" \
            --notes-file notes.md \
            --verify-tag \
            dist/*
