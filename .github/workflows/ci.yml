name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # See the frontend job: the lock file needs npm 12 to install.
      - run: npm install -g npm@12

      # The Wails backend links GTK4 and WebKitGTK through cgo, so even `go
      # vet` needs the development headers present.
      #
      # libwebkitgtk-6.0-dev drags in a long tail of libraries, and on Ubuntu
      # 24.04 needrestart interrupts that with a "which services should be
      # restarted?" prompt nobody is there to answer, so the step hangs until
      # the job times out. NEEDRESTART_MODE=a answers it, the lock timeout
      # turns a contended dpkg lock into an error instead of a wait, and the
      # step timeout caps the damage if apt finds a new way to stall.
      - name: Install GTK4 and WebKitGTK development files
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y --no-install-recommends \
            -o DPkg::Lock::Timeout=300 \
            libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      # main.go embeds frontend/dist, which is build output and therefore not
      # in the repository. Without it, even `go vet` fails to load package
      # main with "pattern all:frontend/dist: no matching files found".
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - run: go vet ./...
      - run: go test ./...

  frontend:
    name: Frontend checks
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # package-lock.json is generated by npm 12, which omits optional peer
      # dependencies that npm 10 (the version bundled with Node 22) insists on
      # finding. Running npm ci with the older client fails with "Missing:
      # esbuild@0.28.1 from lock file", so pin the client to the major that
      # wrote the lock.
      - run: npm install -g npm@12

      - working-directory: frontend
        run: npm ci

      # svelte-check runs TypeScript in strict mode plus Svelte's own
      # diagnostics.
      - working-directory: frontend
        run: npm run check

      - working-directory: frontend
        run: npm run test

  packaging:
    name: Packaging metadata
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y --no-install-recommends \
            -o DPkg::Lock::Timeout=300 \
            desktop-file-utils appstream shellcheck

      - name: Validate desktop entries
        run: |
          desktop-file-validate packaging/ssh-first.desktop
          desktop-file-validate packaging/ssh-first-autostart.desktop

      # Catches a malformed metainfo file here rather than three minutes into
      # the Flatpak build during a release.
      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net packaging/org.wails.ssh_first.metainfo.xml

      - name: Check packaging scripts
        run: shellcheck packaging/stage-tree.sh
